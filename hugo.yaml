# Hugo configuration file
title: Therkildsen Lab User-Guide

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Lab Website
      url: "https://therkildsen-lab.github.io/"
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/therkildsen-lab/user-guide"
      params:
        icon: github

params:
  theme:
    # light | dark | system
    default: light
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
        path: images/logo.png
        dark: images/logo.png
        link: /user-guide/docs
        width: 40
        height: 40
  footer:
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: "https://github.com/therkildsen-lab/user-guide/edit/main/content"
  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  # Display the author of the last modification
  displayUpdatedAuthor: true